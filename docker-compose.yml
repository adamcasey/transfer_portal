services:
  db:
    image: postgres:11
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./tmp/db:/var/lib/postgresql/data
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    command: bundle exec rails s -p 3000 -b 0.0.0.0
    volumes:
      - ./backend:/myapp/backend
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      DATABASE_URL: postgres://postgres@db:5432/transfer_portal_development
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:3000
    volumes:
      - ./frontend/src:/myapp/frontend/src:delegated
      - ./frontend/webpack.config.js:/myapp/frontend/webpack.config.js:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
